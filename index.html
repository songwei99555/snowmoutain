<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D 冰雪山谷 (Winter Mountain Valley 3D) - Three.js</title>
  <link rel="stylesheet" href="./style.css">

  <!-- Import Maps for Three.js & Addons -->
  <script type="importmap">
  {
    "imports": {
      "three": "./libs/three.module.js",
      "three/addons/": "./libs/"
    }
  }
  </script>
</head>
<body>
  <!-- 3D WebGL Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader-spinner"></div>
    <div class="loader-text">生成 3D 冰雪山谷中...</div>
    <div class="loader-subtext">正在雕琢高山峡谷、冰河、雪松林与暴风雪粒子</div>
  </div>

  <!-- Top Left Brand / Title -->
  <header class="header-brand">
    <div class="brand-title">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
      </svg>
      <span>3D 冰雪山谷</span>
    </div>
    <div class="brand-subtitle">Winter Mountain Valley & Snow Simulation</div>
  </header>

  <!-- Top Right HUD (FPS & Particle count) -->
  <div class="stats-hud">
    <div class="hud-chip">
      <span class="hud-label">FPS:</span>
      <span id="fps-val" class="hud-val">60</span>
    </div>
    <div class="hud-chip">
      <span class="hud-label">雪花粒子:</span>
      <span id="particles-val" class="hud-val">22,000</span>
    </div>
  </div>

  <!-- Interactive Controls Panel -->
  <aside class="control-panel" id="control-panel">
    <div class="panel-header" id="btn-toggle-panel">
      <div class="panel-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>场景与风雪控制</span>
      </div>
      <button class="toggle-icon" aria-label="收起面板">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </div>

    <!-- 1. Snowfall Intensity -->
    <div class="panel-section">
      <div class="section-label">降雪强度</div>
      <div class="btn-grid">
        <button class="btn-chip" data-snow="0">轻柔细雪</button>
        <button class="btn-chip active" data-snow="1">纷飞大雪</button>
        <button class="btn-chip" data-snow="2">呼啸暴雪</button>
      </div>
    </div>

    <!-- 2. Atmosphere / Time Theme -->
    <div class="panel-section">
      <div class="section-label">时间与光影氛围</div>
      <div class="btn-grid">
        <button class="btn-chip" data-theme="dawn">冬日暖阳</button>
        <button class="btn-chip active" data-theme="overcast">阴云风雪</button>
        <button class="btn-chip" data-theme="aurora">极光冬夜</button>
      </div>
    </div>

    <!-- 3. Camera Viewpoint Presets -->
    <div class="panel-section">
      <div class="section-label">经典视角</div>
      <div class="btn-grid cols-2">
        <button class="btn-chip active" data-view="panorama">峡谷全景</button>
        <button class="btn-chip" data-view="canyon">谷底穿行</button>
        <button class="btn-chip" data-view="forest">半山雪松</button>
        <button class="btn-chip" data-view="peak">雪峰俯瞰</button>
      </div>
    </div>

    <!-- 4. Dynamic Wind Controls -->
    <div class="panel-section">
      <div class="section-label">山谷风力</div>
      <div class="slider-group">
        <div class="slider-header">
          <span>风速</span>
        </div>
        <input type="range" id="slider-wind-speed" min="2" max="45" value="15" step="1">
      </div>
      <div class="slider-group">
        <div class="slider-header">
          <span>风向方位</span>
        </div>
        <input type="range" id="slider-wind-dir" min="0" max="360" value="45" step="5">
      </div>
    </div>

    <!-- 5. Actions (Fly-through & Ambient Audio) -->
    <div class="panel-section">
      <div class="section-label">沉浸体验</div>
      <button class="action-btn" id="btn-cinematic">
        <div class="btn-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          <span class="btn-label">电影运镜漫游</span>
        </div>
        <span class="status-badge">AUTO</span>
      </button>

      <button class="action-btn" id="btn-audio">
        <div class="btn-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <span>风雪环境音效</span>
        </div>
        <span class="status-badge audio-status">静音</span>
      </button>
    </div>
  </aside>

  <!-- Navigation Tips / Footer -->
  <footer class="footer-tips">
    <div class="tip-item">
      <span class="tip-key">鼠标左键</span>
      <span>360° 旋转</span>
    </div>
    <div class="tip-item">
      <span class="tip-key">鼠标滚轮</span>
      <span>推拉缩放</span>
    </div>
    <div class="tip-item">
      <span class="tip-key">鼠标右键</span>
      <span>平移平视</span>
    </div>
  </footer>

  <!-- Application Entry Script -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
