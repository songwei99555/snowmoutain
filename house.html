<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Cozy House in Three.js</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      overflow: hidden;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #webgl-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    /* UI Overlay */
    .ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 18px 22px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      max-width: 320px;
      color: #2c3e50;
      transition: all 0.3s ease;
    }
    .ui-container.dark {
      background: rgba(22, 27, 46, 0.88);
      border-color: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    p.subtitle {
      font-size: 0.82rem;
      opacity: 0.75;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .button-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    button {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }
    .ui-container.dark button {
      background: #2d3748;
      border-color: #4a5568;
      color: #f7fafc;
    }
    button:hover {
      background: #f3f4f6;
      border-color: #9ca3af;
      transform: translateY(-1px);
    }
    .ui-container.dark button:hover {
      background: #3a475d;
      border-color: #718096;
    }
    button:active {
      transform: translateY(0);
    }
    button.active {
      background: #3b82f6;
      color: white;
      border-color: #2563eb;
    }
    .instructions {
      font-size: 0.75rem;
      opacity: 0.65;
      border-top: 1px solid rgba(150, 150, 150, 0.25);
      padding-top: 10px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.7rem;
    }
    .ui-container.dark .badge {
      background: rgba(255, 255, 255, 0.12);
    }
  </style>

  <!-- Three.js & OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div class="ui-container" id="ui-panel">
    <h1>🏡 Cozy Suburban Cottage</h1>
    <p class="subtitle">Interactive 3D model built with Three.js procedurally.</p>

    <div class="button-group">
      <button id="btn-tod">☀️ Day Time</button>
      <button id="btn-lights">💡 Interior Lights</button>
      <button id="btn-front">👀 Front View</button>
      <button id="btn-iso">📐 Isometric</button>
    </div>

    <div class="instructions">
      <span class="badge">Drag</span> Rotate scene<br>
      <span class="badge">Right-click / 2-finger</span> Pan<br>
      <span class="badge">Scroll / Pinch</span> Zoom in / out
    </div>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <script>
    // --- 1. Scene, Camera, and Renderer Setup ---
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    
    // Background and Fog for atmospheric depth
    const skyDay = new THREE.Color(0xbde0fe);
    const skyNight = new THREE.Color(0x0b132b);
    const fogDay = new THREE.Color(0xd0e8ff);
    const fogNight = new THREE.Color(0x0d1b2a);
    
    scene.background = skyDay.clone();
    scene.fog = new THREE.FogExp2(fogDay, 0.015);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(22, 14, 26);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent going underneath the ground
    controls.minDistance = 8;
    controls.maxDistance = 65;
    controls.target.set(0, 3.5, 0);

    // --- 2. Lighting System ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x446622, 0.35);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff7e6, 1.2);
    sunLight.position.set(25, 35, 18);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 100;
    const shadowD = 22;
    sunLight.shadow.camera.left = -shadowD;
    sunLight.shadow.camera.right = shadowD;
    sunLight.shadow.camera.top = shadowD;
    sunLight.shadow.camera.bottom = -shadowD;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    // Point lights for cozy evening atmosphere
    const porchLight = new THREE.PointLight(0xffa238, 0, 8);
    porchLight.position.set(0, 3.2, 5.8);
    porchLight.castShadow = true;
    scene.add(porchLight);

    const lampPostLight = new THREE.PointLight(0xffb74d, 0, 10);
    lampPostLight.position.set(7.5, 4.2, 9.5);
    lampPostLight.castShadow = true;
    scene.add(lampPostLight);

    // Array of interior window point lights
    const interiorLights = [];
    function addInteriorLight(x, y, z) {
      const pl = new THREE.PointLight(0xffb042, 0.8, 7);
      pl.position.set(x, y, z);
      scene.add(pl);
      interiorLights.push(pl);
    }
    addInteriorLight(0, 2.5, 0);
    addInteriorLight(0, 5.5, 0);

    // --- 3. Material Library ---
    const materials = {
      grass: new THREE.MeshStandardMaterial({ color: 0x6ca349, roughness: 0.85 }),
      dirtPath: new THREE.MeshStandardMaterial({ color: 0x937c64, roughness: 0.95 }),
      steppingStone: new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.6 }),
      foundation: new THREE.MeshStandardMaterial({ color: 0x73797f, roughness: 0.9 }),
      wall: new THREE.MeshStandardMaterial({ color: 0xf3ede2, roughness: 0.6 }),
      wallTrim: new THREE.MeshStandardMaterial({ color: 0xdfd8ca, roughness: 0.5 }),
      roof: new THREE.MeshStandardMaterial({ color: 0x334756, roughness: 0.4 }),
      roofEdge: new THREE.MeshStandardMaterial({ color: 0x22303c, roughness: 0.4 }),
      woodDeck: new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.75 }),
      door: new THREE.MeshStandardMaterial({ color: 0x5a2d1a, roughness: 0.5 }),
      doorFrame: new THREE.MeshStandardMaterial({ color: 0xdfd8ca, roughness: 0.4 }),
      knob: new THREE.MeshStandardMaterial({ color: 0xefb700, metalness: 0.85, roughness: 0.2 }),
      windowFrame: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }),
      glass: new THREE.MeshStandardMaterial({
        color: 0xffe8a3,
        emissive: 0xffa834,
        emissiveIntensity: 0.45,
        roughness: 0.1,
        metalness: 0.1,
        transparent: true,
        opacity: 0.92
      }),
      brick: new THREE.MeshStandardMaterial({ color: 0x994433, roughness: 0.9 }),
      chimneyCap: new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 }),
      woodTrunk: new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 }),
      foliageGreen1: new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.75, flatShading: true }),
      foliageGreen2: new THREE.MeshStandardMaterial({ color: 0x388e3c, roughness: 0.75, flatShading: true }),
      foliageGreen3: new THREE.MeshStandardMaterial({ color: 0x43a047, roughness: 0.75, flatShading: true }),
      bushGreen: new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.8, flatShading: true }),
      flowerPink: new THREE.MeshStandardMaterial({ color: 0xff4081, roughness: 0.5 }),
      flowerYellow: new THREE.MeshStandardMaterial({ color: 0xffd54f, roughness: 0.5 }),
      flowerViolet: new THREE.MeshStandardMaterial({ color: 0x7c4dff, roughness: 0.5 }),
      fenceWood: new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.6 }),
      metalPole: new THREE.MeshStandardMaterial({ color: 0x263238, metalness: 0.8, roughness: 0.3 }),
      lanternBulb: new THREE.MeshStandardMaterial({
        color: 0xffe082,
        emissive: 0xffb300,
        emissiveIntensity: 0.8
      })
    };

    // Helper function to set shadows on objects
    function applyShadows(obj, cast = true, receive = true) {
      obj.traverse(child => {
        if (child.isMesh) {
          child.castShadow = cast;
          child.receiveShadow = receive;
        }
      });
      return obj;
    }

    // --- 4. Building the House & Surroundings ---

    const houseGroup = new THREE.Group();
    scene.add(houseGroup);

    // 4.1 Ground & Island Base
    const groundRadius = 24;
    const groundGeo = new THREE.CylinderGeometry(groundRadius, groundRadius + 1.5, 1.2, 64);
    const groundMesh = new THREE.Mesh(groundGeo, materials.grass);
    groundMesh.position.y = -0.6;
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    // Dirt base under the grass layer
    const underGroundGeo = new THREE.CylinderGeometry(groundRadius + 1.5, groundRadius + 2, 2.5, 64);
    const underGroundMesh = new THREE.Mesh(underGroundGeo, materials.dirtPath);
    underGroundMesh.position.y = -2.45;
    underGroundMesh.receiveShadow = true;
    scene.add(underGroundMesh);

    // 4.2 Foundation & Main Walls
    const foundation = new THREE.Mesh(
      new THREE.BoxGeometry(10.4, 0.6, 9.4),
      materials.foundation
    );
    foundation.position.set(0, 0.3, 0);
    applyShadows(foundation);
    houseGroup.add(foundation);

    const houseWidth = 10;
    const houseHeight = 5.2;
    const houseDepth = 9;

    const walls = new THREE.Mesh(
      new THREE.BoxGeometry(houseWidth, houseHeight, houseDepth),
      materials.wall
    );
    walls.position.set(0, 0.6 + houseHeight / 2, 0);
    applyShadows(walls);
    houseGroup.add(walls);

    // Trim line separating lower and upper floors
    const trim = new THREE.Mesh(
      new THREE.BoxGeometry(houseWidth + 0.15, 0.15, houseDepth + 0.15),
      materials.wallTrim
    );
    trim.position.set(0, 3.2, 0);
    applyShadows(trim);
    houseGroup.add(trim);

    // 4.3 Gable Roof (Sloped Roof with Eaves & Front/Back triangular gables)
    const roofY = 0.6 + houseHeight;
    const roofOverhang = 0.7;
    const roofApexHeight = 3.6;
    const halfWidth = houseWidth / 2;
    const halfDepth = houseDepth / 2;

    // Front Gable Triangle
    const gableShape = new THREE.Shape();
    gableShape.moveTo(-halfWidth, 0);
    gableShape.lineTo(0, roofApexHeight);
    gableShape.lineTo(halfWidth, 0);
    gableShape.closePath();

    const gableFront = new THREE.Mesh(
      new THREE.ShapeGeometry(gableShape),
      materials.wall
    );
    gableFront.position.set(0, roofY, halfDepth);
    applyShadows(gableFront);
    houseGroup.add(gableFront);

    // Back Gable Triangle
    const gableBack = gableFront.clone();
    gableBack.rotation.y = Math.PI;
    gableBack.position.set(0, roofY, -halfDepth);
    applyShadows(gableBack);
    houseGroup.add(gableBack);

    // Roof slopes (Left & Right)
    const slopeLength = Math.hypot(halfWidth + roofOverhang, roofApexHeight) + 0.2;
    const slopeAngle = Math.atan2(roofApexHeight, halfWidth + roofOverhang);
    const roofThickness = 0.22;
    const roofLength = houseDepth + roofOverhang * 2;

    // Right Slope
    const rightSlope = new THREE.Mesh(
      new THREE.BoxGeometry(slopeLength, roofThickness, roofLength),
      materials.roof
    );
    rightSlope.position.set(
      (halfWidth + roofOverhang) / 2 - 0.1,
      roofY + roofApexHeight / 2,
      0
    );
    rightSlope.rotation.z = -slopeAngle;
    applyShadows(rightSlope);
    houseGroup.add(rightSlope);

    // Left Slope
    const leftSlope = new THREE.Mesh(
      new THREE.BoxGeometry(slopeLength, roofThickness, roofLength),
      materials.roof
    );
    leftSlope.position.set(
      -(halfWidth + roofOverhang) / 2 + 0.1,
      roofY + roofApexHeight / 2,
      0
    );
    leftSlope.rotation.z = slopeAngle;
    applyShadows(leftSlope);
    houseGroup.add(leftSlope);

    // Ridge Beam (Top cap)
    const ridgeBeam = new THREE.Mesh(
      new THREE.BoxGeometry(0.35, 0.35, roofLength + 0.1),
      materials.roofEdge
    );
    ridgeBeam.position.set(0, roofY + roofApexHeight + 0.05, 0);
    applyShadows(ridgeBeam);
    houseGroup.add(ridgeBeam);

    // 4.4 Chimney & Particle Smoke
    const chimney = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 3.8, 1.2),
      materials.brick
    );
    chimney.position.set(-2.8, roofY + 2.2, -1.5);
    applyShadows(chimney);
    houseGroup.add(chimney);

    const chimneyCap = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 0.25, 1.5),
      materials.chimneyCap
    );
    chimneyCap.position.set(-2.8, roofY + 4.15, -1.5);
    applyShadows(chimneyCap);
    houseGroup.add(chimneyCap);

    // Smoke particles array
    const smokeParticles = [];
    const smokeMat = new THREE.MeshLambertMaterial({
      color: 0xefefef,
      transparent: true,
      opacity: 0.45
    });
    const smokeGeo = new THREE.DodecahedronGeometry(0.28, 1);

    for (let i = 0; i < 22; i++) {
      const smoke = new THREE.Mesh(smokeGeo, smokeMat.clone());
      smoke.position.set(
        -2.8 + (Math.random() - 0.5) * 0.3,
        roofY + 4.3 + i * 0.35,
        -1.5 + (Math.random() - 0.5) * 0.3
      );
      smoke.scale.setScalar(0.7 + i * 0.08);
      smoke.userData = {
        speedY: 0.025 + Math.random() * 0.02,
        initialY: roofY + 4.3,
        maxY: roofY + 11.5,
        wobbleSpeed: 1 + Math.random() * 2,
        wobbleOffset: Math.random() * Math.PI * 2
      };
      scene.add(smoke);
      smokeParticles.push(smoke);
    }

    // 4.5 Front Porch & Entrance
    const porchDeck = new THREE.Mesh(
      new THREE.BoxGeometry(4.8, 0.4, 2.4),
      materials.woodDeck
    );
    porchDeck.position.set(0, 0.3, halfDepth + 1.2);
    applyShadows(porchDeck);
    houseGroup.add(porchDeck);

    // Porch Steps
    for (let s = 1; s <= 2; s++) {
      const step = new THREE.Mesh(
        new THREE.BoxGeometry(4.4, 0.15, 0.5),
        materials.woodDeck
      );
      step.position.set(0, 0.3 - s * 0.12, halfDepth + 2.4 + s * 0.45);
      applyShadows(step);
      houseGroup.add(step);
    }

    // Porch Columns
    const colGeo = new THREE.BoxGeometry(0.22, 2.7, 0.22);
    const colLeft = new THREE.Mesh(colGeo, materials.wallTrim);
    colLeft.position.set(-2.1, 0.5 + 1.35, halfDepth + 2.2);
    applyShadows(colLeft);
    houseGroup.add(colLeft);

    const colRight = colLeft.clone();
    colRight.position.x = 2.1;
    applyShadows(colRight);
    houseGroup.add(colRight);

    // Porch Roof
    const porchRoof = new THREE.Mesh(
      new THREE.BoxGeometry(5.2, 0.25, 2.7),
      materials.roof
    );
    porchRoof.position.set(0, 3.25, halfDepth + 1.35);
    porchRoof.rotation.x = 0.08;
    applyShadows(porchRoof);
    houseGroup.add(porchRoof);

    // 4.6 Front Door with Trim & Knob
    const doorGroup = new THREE.Group();
    doorGroup.position.set(0, 0.6, halfDepth + 0.01);

    const doorFrame = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 2.9, 0.12),
      materials.doorFrame
    );
    doorFrame.position.set(0, 1.45, 0.05);
    applyShadows(doorFrame);
    doorGroup.add(doorFrame);

    const door = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 2.65, 0.08),
      materials.door
    );
    door.position.set(0, 1.35, 0.07);
    applyShadows(door);
    doorGroup.add(door);

    // Door knob
    const knob = new THREE.Mesh(
      new THREE.SphereGeometry(0.07, 16, 16),
      materials.knob
    );
    knob.position.set(0.55, 1.3, 0.14);
    applyShadows(knob);
    doorGroup.add(knob);

    // Porch Sconce Light
    const sconceBase = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.35, 0.15),
      materials.metalPole
    );
    sconceBase.position.set(1.15, 2.4, 0.1);
    doorGroup.add(sconceBase);

    const sconceLantern = new THREE.Mesh(
      new THREE.BoxGeometry(0.24, 0.38, 0.24),
      materials.lanternBulb
    );
    sconceLantern.position.set(1.15, 2.4, 0.24);
    doorGroup.add(sconceLantern);

    houseGroup.add(doorGroup);

    // 4.7 Windows Builder
    function createWindow(width, height, hasShutters = false, hasFlowerBox = false) {
      const winGroup = new THREE.Group();
      
      // Outer Frame
      const frameThickness = 0.14;
      const frame = new THREE.Mesh(
        new THREE.BoxGeometry(width + frameThickness * 2, height + frameThickness * 2, 0.12),
        materials.windowFrame
      );
      applyShadows(frame);
      winGroup.add(frame);

      // Glass pane
      const glass = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, 0.06),
        materials.glass
      );
      winGroup.add(glass);

      // Horizontal & Vertical Grid dividers (Muntins)
      const hGrid = new THREE.Mesh(
        new THREE.BoxGeometry(width, 0.06, 0.08),
        materials.windowFrame
      );
      winGroup.add(hGrid);

      const vGrid = new THREE.Mesh(
        new THREE.BoxGeometry(0.06, height, 0.08),
        materials.windowFrame
      );
      winGroup.add(vGrid);

      // Shutters
      if (hasShutters) {
        const shutterWidth = width * 0.42;
        const shutterGeo = new THREE.BoxGeometry(shutterWidth, height + frameThickness, 0.08);
        const shutterMat = materials.woodDeck;

        const leftShutter = new THREE.Mesh(shutterGeo, shutterMat);
        leftShutter.position.set(-(width / 2 + shutterWidth / 2 + 0.08), 0, 0.04);
        applyShadows(leftShutter);
        winGroup.add(leftShutter);

        const rightShutter = leftShutter.clone();
        rightShutter.position.x = width / 2 + shutterWidth / 2 + 0.08;
        applyShadows(rightShutter);
        winGroup.add(rightShutter);
      }

      // Flower Box
      if (hasFlowerBox) {
        const boxWidth = width + 0.4;
        const box = new THREE.Mesh(
          new THREE.BoxGeometry(boxWidth, 0.32, 0.42),
          materials.woodDeck
        );
        box.position.set(0, -(height / 2 + 0.2), 0.22);
        applyShadows(box);
        winGroup.add(box);

        // Flowers in box
        const flowerGeom = new THREE.DodecahedronGeometry(0.12);
        const flowerColors = [materials.flowerPink, materials.flowerYellow, materials.flowerViolet];
        for (let f = 0; f < 6; f++) {
          const fl = new THREE.Mesh(
            flowerGeom,
            flowerColors[f % flowerColors.length]
          );
          fl.position.set(
            -boxWidth / 2 + 0.15 + f * (boxWidth / 5.5),
            -(height / 2 + 0.04) + Math.random() * 0.06,
            0.26 + (Math.random() - 0.5) * 0.12
          );
          winGroup.add(fl);
        }
      }

      return winGroup;
    }

    // Front Windows (Ground Floor)
    const winFrontL = createWindow(1.4, 1.8, true, true);
    winFrontL.position.set(-3.2, 2.3, halfDepth + 0.05);
    houseGroup.add(winFrontL);

    const winFrontR = createWindow(1.4, 1.8, true, true);
    winFrontR.position.set(3.2, 2.3, halfDepth + 0.05);
    houseGroup.add(winFrontR);

    // Front Attic Window (Round or arched)
    const atticWin = createWindow(1.2, 1.2, false, false);
    atticWin.position.set(0, roofY + 1.8, halfDepth + 0.05);
    houseGroup.add(atticWin);

    // Side Windows (Left & Right)
    const winSideL1 = createWindow(1.5, 1.6, true, false);
    winSideL1.rotation.y = -Math.PI / 2;
    winSideL1.position.set(-halfWidth - 0.05, 2.3, 1.5);
    houseGroup.add(winSideL1);

    const winSideL2 = createWindow(1.5, 1.6, true, false);
    winSideL2.rotation.y = -Math.PI / 2;
    winSideL2.position.set(-halfWidth - 0.05, 2.3, -2);
    houseGroup.add(winSideL2);

    const winSideR1 = createWindow(1.5, 1.6, true, false);
    winSideR1.rotation.y = Math.PI / 2;
    winSideR1.position.set(halfWidth + 0.05, 2.3, 1.5);
    houseGroup.add(winSideR1);

    const winSideR2 = createWindow(1.5, 1.6, true, false);
    winSideR2.rotation.y = Math.PI / 2;
    winSideR2.position.set(halfWidth + 0.05, 2.3, -2);
    houseGroup.add(winSideR2);

    // Back Windows
    const winBackL = createWindow(1.5, 1.8, false, false);
    winBackL.rotation.y = Math.PI;
    winBackL.position.set(-2.6, 2.3, -halfDepth - 0.05);
    houseGroup.add(winBackL);

    const winBackR = createWindow(1.5, 1.8, false, false);
    winBackR.rotation.y = Math.PI;
    winBackR.position.set(2.6, 2.3, -halfDepth - 0.05);
    houseGroup.add(winBackR);

    // 4.8 Garden Pathway & Stepping Stones
    const pathGroup = new THREE.Group();
    const stoneGeom = new THREE.CylinderGeometry(0.65, 0.7, 0.08, 8);
    const stoneCoords = [
      { x: 0, z: 8.5 },
      { x: -0.2, z: 10.1 },
      { x: 0.3, z: 11.7 },
      { x: 0.1, z: 13.3 },
      { x: -0.4, z: 14.9 },
      { x: 0.2, z: 16.5 },
      { x: 0.0, z: 18.1 },
      { x: -0.1, z: 19.8 }
    ];

    stoneCoords.forEach((coord, i) => {
      const stone = new THREE.Mesh(stoneGeom, materials.steppingStone);
      stone.position.set(coord.x, 0.04, coord.z);
      stone.rotation.y = Math.random() * Math.PI;
      stone.scale.set(1 + Math.random() * 0.2, 1, 0.85 + Math.random() * 0.3);
      stone.receiveShadow = true;
      pathGroup.add(stone);
    });
    scene.add(pathGroup);

    // 4.9 Low-Poly Stylized Trees
    function createTree(scale = 1) {
      const tree = new THREE.Group();
      
      // Trunk
      const trunkH = 2.4 * scale;
      const trunkR = 0.32 * scale;
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(trunkR * 0.7, trunkR, trunkH, 8),
        materials.woodTrunk
      );
      trunk.position.y = trunkH / 2;
      applyShadows(trunk);
      tree.add(trunk);

      // Multi-layer Conical Foliage
      const foliageMats = [materials.foliageGreen1, materials.foliageGreen2, materials.foliageGreen3];
      const layers = 3;
      for (let l = 0; l < layers; l++) {
        const radius = (2.2 - l * 0.45) * scale;
        const height = (2.2 - l * 0.3) * scale;
        const cone = new THREE.Mesh(
          new THREE.ConeGeometry(radius, height, 7),
          foliageMats[l % foliageMats.length]
        );
        cone.position.y = trunkH + (l * 1.25 + 0.6) * scale;
        cone.rotation.y = l * 0.5;
        applyShadows(cone);
        tree.add(cone);
      }
      return tree;
    }

    const treePositions = [
      { x: -14, z: -8, scale: 1.4 },
      { x: -12, z: 6, scale: 1.1 },
      { x: -15, z: 14, scale: 1.2 },
      { x: 13, z: -10, scale: 1.5 },
      { x: 14, z: 4, scale: 1.25 },
      { x: 12, z: 15, scale: 1.05 }
    ];

    treePositions.forEach(pos => {
      const tree = createTree(pos.scale);
      tree.position.set(pos.x, 0, pos.z);
      scene.add(tree);
    });

    // 4.10 Bushes & Shrubs around the house
    function createBush(radius = 0.7) {
      const bush = new THREE.Mesh(
        new THREE.DodecahedronGeometry(radius, 1),
        materials.bushGreen
      );
      bush.scale.set(1.2, 0.9, 1);
      applyShadows(bush);
      return bush;
    }

    const bushPositions = [
      { x: -3.5, y: 0.3, z: halfDepth + 0.4, r: 0.8 },
      { x: -4.6, y: 0.3, z: halfDepth + 0.2, r: 0.65 },
      { x: 3.5, y: 0.3, z: halfDepth + 0.4, r: 0.8 },
      { x: 4.6, y: 0.3, z: halfDepth + 0.2, r: 0.65 },
      { x: -halfWidth - 0.2, y: 0.3, z: -0.5, r: 0.75 },
      { x: -halfWidth - 0.2, y: 0.3, z: 3.2, r: 0.7 },
      { x: halfWidth + 0.2, y: 0.3, z: -0.5, r: 0.75 },
      { x: halfWidth + 0.2, y: 0.3, z: 3.2, r: 0.7 }
    ];

    bushPositions.forEach(b => {
      const bush = createBush(b.r);
      bush.position.set(b.x, b.y, b.z);
      scene.add(bush);
    });

    // 4.11 Garden Lamp Post
    const lampPost = new THREE.Group();
    lampPost.position.set(7.5, 0, 9.5);

    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.16, 4.2, 8),
      materials.metalPole
    );
    pole.position.y = 2.1;
    applyShadows(pole);
    lampPost.add(pole);

    const lampHead = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 0.7, 0.55),
      materials.lanternBulb
    );
    lampHead.position.y = 4.2;
    lampPost.add(lampHead);

    const lampCap = new THREE.Mesh(
      new THREE.ConeGeometry(0.55, 0.35, 4),
      materials.metalPole
    );
    lampCap.position.y = 4.7;
    lampCap.rotation.y = Math.PI / 4;
    lampPost.add(lampCap);

    scene.add(lampPost);

    // 4.12 Cute Mailbox
    const mailbox = new THREE.Group();
    mailbox.position.set(2.4, 0, 18.5);
    mailbox.rotation.y = -Math.PI / 6;

    const mbPost = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.08, 1.5, 8),
      materials.woodTrunk
    );
    mbPost.position.y = 0.75;
    applyShadows(mbPost);
    mailbox.add(mbPost);

    const mbBox = new THREE.Mesh(
      new THREE.BoxGeometry(0.45, 0.45, 0.8),
      materials.fenceWood
    );
    mbBox.position.set(0, 1.5, 0);
    applyShadows(mbBox);
    mailbox.add(mbBox);

    const mbFlag = new THREE.Mesh(
      new THREE.BoxGeometry(0.04, 0.25, 0.1),
      materials.brick
    );
    mbFlag.position.set(0.24, 1.6, -0.2);
    mailbox.add(mbFlag);

    scene.add(mailbox);

    // 4.13 Picket Fence
    const fenceGroup = new THREE.Group();
    const fencePostGeo = new THREE.BoxGeometry(0.14, 1.1, 0.14);
    const fenceRailGeo = new THREE.BoxGeometry(1.6, 0.08, 0.06);

    // Front fence on both sides of pathway
    function buildFenceLine(startX, endX, zPos) {
      const dist = Math.abs(endX - startX);
      const postCount = Math.floor(dist / 0.85);
      for (let i = 0; i <= postCount; i++) {
        const x = startX + (i / postCount) * (endX - startX);
        const post = new THREE.Mesh(fencePostGeo, materials.fenceWood);
        post.position.set(x, 0.55, zPos);
        applyShadows(post);
        fenceGroup.add(post);
      }
      const rail1 = new THREE.Mesh(
        new THREE.BoxGeometry(dist, 0.08, 0.06),
        materials.fenceWood
      );
      rail1.position.set((startX + endX) / 2, 0.4, zPos);
      applyShadows(rail1);
      fenceGroup.add(rail1);

      const rail2 = rail1.clone();
      rail2.position.y = 0.8;
      applyShadows(rail2);
      fenceGroup.add(rail2);
    }

    buildFenceLine(-17, -2.5, 19.5);
    buildFenceLine(2.5, 17, 19.5);
    scene.add(fenceGroup);

    // --- 5. Interactive UI & Controls ---
    let isDay = true;
    let lightsOn = true;

    const btnTod = document.getElementById('btn-tod');
    const btnLights = document.getElementById('btn-lights');
    const btnFront = document.getElementById('btn-front');
    const btnIso = document.getElementById('btn-iso');
    const uiPanel = document.getElementById('ui-panel');

    function updateLightingMode() {
      if (isDay) {
        // Day theme
        scene.background.copy(skyDay);
        scene.fog.color.copy(fogDay);
        sunLight.intensity = 1.2;
        sunLight.color.setHex(0xfff7e6);
        ambientLight.intensity = 0.45;
        hemiLight.intensity = 0.35;
        porchLight.intensity = lightsOn ? 0.8 : 0;
        lampPostLight.intensity = lightsOn ? 1.0 : 0;
        btnTod.innerHTML = '☀️ Day Time';
        uiPanel.classList.remove('dark');
      } else {
        // Night theme
        scene.background.copy(skyNight);
        scene.fog.color.copy(fogNight);
        sunLight.intensity = 0.15;
        sunLight.color.setHex(0x5c7cfa);
        ambientLight.intensity = 0.1;
        hemiLight.intensity = 0.05;
        porchLight.intensity = lightsOn ? 2.5 : 0;
        lampPostLight.intensity = lightsOn ? 3.0 : 0;
        btnTod.innerHTML = '🌙 Night Time';
        uiPanel.classList.add('dark');
      }
      updateInteriorLights();
    }

    function updateInteriorLights() {
      interiorLights.forEach(l => {
        l.intensity = lightsOn ? (isDay ? 0.8 : 1.8) : 0;
      });
      materials.glass.emissiveIntensity = lightsOn ? (isDay ? 0.35 : 0.85) : 0.05;
      materials.lanternBulb.emissiveIntensity = lightsOn ? 1.0 : 0.1;
    }

    btnTod.addEventListener('click', () => {
      isDay = !isDay;
      updateLightingMode();
    });

    btnLights.addEventListener('click', () => {
      lightsOn = !lightsOn;
      btnLights.innerHTML = lightsOn ? '💡 Lights ON' : '🌑 Lights OFF';
      btnLights.classList.toggle('active', !lightsOn);
      updateLightingMode();
    });

    // Smooth camera tween helper
    let targetCamPos = null;
    let targetLookAt = null;

    function animateCameraTo(posX, posY, posZ, lookX = 0, lookY = 3.5, lookZ = 0) {
      targetCamPos = new THREE.Vector3(posX, posY, posZ);
      targetLookAt = new THREE.Vector3(lookX, lookY, lookZ);
    }

    btnFront.addEventListener('click', () => {
      animateCameraTo(0, 6, 26, 0, 3.5, 0);
    });

    btnIso.addEventListener('click', () => {
      animateCameraTo(22, 14, 26, 0, 3.5, 0);
    });

    // Initialize state
    updateLightingMode();

    // --- 6. Resize Handler ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    // --- 7. Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Animate chimney smoke particles
      smokeParticles.forEach(smoke => {
        smoke.position.y += smoke.userData.speedY;
        smoke.position.x += Math.sin(time * smoke.userData.wobbleSpeed + smoke.userData.wobbleOffset) * 0.005;
        
        // Reset when reaching top
        if (smoke.position.y > smoke.userData.maxY) {
          smoke.position.y = smoke.userData.initialY;
          smoke.position.x = -2.8 + (Math.random() - 0.5) * 0.2;
          smoke.position.z = -1.5 + (Math.random() - 0.5) * 0.2;
        }

        // Fade & expand with height
        const progress = (smoke.position.y - smoke.userData.initialY) / (smoke.userData.maxY - smoke.userData.initialY);
        smoke.material.opacity = Math.max(0, 0.45 * (1 - progress));
        const s = 0.7 + progress * 1.5;
        smoke.scale.set(s, s, s);
      });

      // Subtle lantern flicker at night
      if (!isDay && lightsOn) {
        porchLight.intensity = 2.4 + Math.sin(time * 8) * 0.15;
        lampPostLight.intensity = 2.9 + Math.cos(time * 7) * 0.18;
      }

      // Smooth camera transition when preset clicked
      if (targetCamPos) {
        camera.position.lerp(targetCamPos, 0.05);
        controls.target.lerp(targetLookAt, 0.05);
        if (camera.position.distanceTo(targetCamPos) < 0.1) {
          targetCamPos = null;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
